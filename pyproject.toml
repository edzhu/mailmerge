[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "mailmerge"
version = "0.1.0"
description = "Minimal UI app scaffold for macOS and Windows executables"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ui", "tkinter", "pyinstaller"]
dependencies = [
    "lxml>=4.9.0",
    "openpyxl>=3.1.0",
    "mammoth>=1.6.0",
    "msal>=1.25.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5.0"]
preview = ["PySide6-QtWebEngine>=6.5.0"]
build = ["pyinstaller>=6.0"]
test = ["pytest>=8.2.0"]
dev = ["ruff", "black", "mypy", "pre-commit"]

[project.scripts]
mailmerge = "mailmerge.main:main"
ui-app = "mailmerge.main:main"

[tool.hatch.build]
exclude = [
    "src/mailmerge.egg-info/**",
    "core/**",
    "docs/**",
    "scripts/**",
    "tests/**",
    "ui/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mailmerge"]
