[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ui-app"
version = "0.1.0"
description = "Minimal UI app scaffold for macOS and Windows executables"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ui", "tkinter", "pyinstaller"]

[project.scripts]
ui-app = "app.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
