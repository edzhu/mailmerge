[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "mailmerge"
version = "0.1.0"
description = "Minimal UI app scaffold for macOS and Windows executables"
readme = "README.md"
requires-python = ">=3.9,<4.0"
license = { text = "MIT" }
authors = [{ name = "Mailmerge contributors" }]
keywords = ["ui", "tkinter", "pyinstaller"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "lxml>=4.9.0",
    "openpyxl>=3.1.0",
    "mammoth>=1.6.0",
    "msal>=1.25.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/edzhu/mailmerge"
Source = "https://github.com/edzhu/mailmerge"
Issues = "https://github.com/edzhu/mailmerge/issues"

[project.optional-dependencies]
gui = ["PySide6>=6.5.0"]
preview = ["PySide6-QtWebEngine>=6.5.0"]
build = ["pyinstaller>=6.0"]
test = ["pytest>=8.2.0"]
dev = ["ruff", "black", "mypy", "pre-commit"]

[project.scripts]
mailmerge = "mailmerge.main:main"
ui-app = "mailmerge.main:main"

[tool.hatch.build]
exclude = [
    "src/mailmerge.egg-info/**",
    "core/**",
    "docs/**",
    "scripts/**",
    "tests/**",
    "ui/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mailmerge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.black]
target-version = ["py39"]
line-length = 88

[tool.mypy]
python_version = "3.9"
