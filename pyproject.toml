[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ui-app"
version = "0.1.0"
description = "Minimal UI app scaffold for macOS and Windows executables"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ui", "tkinter", "pyinstaller"]
dependencies = [
    "lxml>=4.9.0",
    "openpyxl>=3.1.0",
    "mammoth>=1.6.0",
    "msal>=1.25.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5.0"]
preview = ["PySide6-QtWebEngine>=6.5.0"]

[project.scripts]
ui-app = "app.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
